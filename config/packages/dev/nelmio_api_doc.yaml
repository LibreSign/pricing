nelmio_api_doc:
  documentation:
    info:
      title: LibreSign Pricing Simulation API
      version: 1.0.0
      description: Synthetic, non-binding simulations; no approved commercial prices.
    components:
      securitySchemes:
        bearerAuth:
          type: http
          scheme: bearer
    security:
      - bearerAuth: []
  areas:
    path_patterns:
      # Private economic endpoints are intentionally outside the public synthetic OpenAPI.
      - '^/v1/simulations$'
