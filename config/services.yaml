parameters:
  env(PRICING_CATALOG_PATH): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  LibreSign\Pricing\:
    resource: '../src/'
    exclude: '../src/Kernel.php'

  LibreSign\Pricing\Infrastructure\SyntheticCatalog:
    arguments:
      $filename: '%env(string:PRICING_CATALOG_PATH)%'
