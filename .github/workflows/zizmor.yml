name: GitHub Actions security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit all workflows with Zizmor
        run: |
          python3 -m venv /tmp/pricing-zizmor
          /tmp/pricing-zizmor/bin/pip install --disable-pip-version-check 'zizmor==1.32.0'
          /tmp/pricing-zizmor/bin/zizmor .github/workflows/
