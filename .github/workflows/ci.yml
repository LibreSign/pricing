name: PHP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP 8.5 tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2026-10-08)
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Validate PHP runtime and manifests
        run: |
          php -r 'if (PHP_VERSION_ID < 80512) exit(1);'
          composer validate --strict

      - name: Install locked dependencies and isolated tools
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax
        run: composer lint

      - name: PHP style
        run: composer style

      - name: Static analysis
        run: composer analyse

      - name: PHPUnit
        env:
          APP_ENV: test
          APP_SECRET: synthetic-test-secret-only
          PRICING_API_TOKEN: test-only-synthetic-token
        run: composer test

      - name: Generated OpenAPI contract
        run: composer api:check

      - name: Dependency security advisories
        run: |
          composer audit --locked
          for bin in vendor-bin/*; do
            if test -f "$bin/composer.lock"; then
              composer --working-dir="$bin" audit --locked
            fi
          done
