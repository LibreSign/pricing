name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: License and workflow policy
        run: |
          python3 -m venv /tmp/pricing-policy
          /tmp/pricing-policy/bin/pip install --disable-pip-version-check 'reuse[charset-normalizer]==6.3.0' 'zizmor==1.32.0'
          /tmp/pricing-policy/bin/reuse lint
          /tmp/pricing-policy/bin/zizmor .github/workflows/quality.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 .github/workflows/quality.yml
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2026-10-08)
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Validate runtime and lockfile
        run: |
          php -r 'if (PHP_VERSION_ID < 80512) exit(1);'
          composer validate --strict
      - name: Install
        run: composer install --prefer-dist --no-progress --no-interaction --no-plugins --no-scripts
      - name: Checks
        env:
          APP_ENV: test
          APP_SECRET: synthetic-test-secret-only
          PRICING_API_TOKEN: test-only-synthetic-token
        run: composer check
