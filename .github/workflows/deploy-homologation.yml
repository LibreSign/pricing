name: Deploy homologation

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full reviewed main commit SHA with published GHCR images'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pricing-homologation-deploy
  cancel-in-progress: false

jobs:
  homologation:
    name: Deploy reviewed synthetic pricing service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Only allow an exact reviewed main commit
        env:
          TARGET_SHA: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main

      - name: Deploy through verified SSH with no public port exposure
        env:
          TARGET_SHA: ${{ inputs.revision }}
          DEPLOY_HOST: ${{ vars.PRICING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.PRICING_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.PRICING_DEPLOY_PORT }}
          DEPLOY_SCRIPT: ${{ vars.PRICING_DEPLOY_SCRIPT }}
          DEPLOY_KEY: ${{ secrets.PRICING_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRICING_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure the homologation host}"
          : "${DEPLOY_USER:?Configure the restricted deployment user}"
          : "${DEPLOY_KEY:?Configure a restricted SSH identity}"
          : "${KNOWN_HOSTS:?Configure the pinned SSH host key}"
          : "${DEPLOY_SCRIPT:?Configure the private deploy script path}"
          [[ "$DEPLOY_SCRIPT" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_SCRIPT" != *..* ]]
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/pricing-deploy-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/pricing-known-hosts"
          chmod 0600 "$RUNNER_TEMP/pricing-deploy-key" "$RUNNER_TEMP/pricing-known-hosts"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/pricing-known-hosts" \
            -i "$RUNNER_TEMP/pricing-deploy-key" -p "$port" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n '$DEPLOY_SCRIPT' '$TARGET_SHA'"
