# Pre-authentication limits are per immediate peer IP. Do not blindly trust X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=pricing_requests:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=pricing_connections:10m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Docker embedded DNS prevents stale FPM IPs when the app container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pricing_fpm "app:9000";

    access_log off;
    error_log /dev/stderr warn;

    client_max_body_size 16k;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 5s;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @rate_limited;

    location = /v1/simulations {
        limit_except POST { deny all; }
        limit_req zone=pricing_requests burst=4 nodelay;
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Role-specific private economic endpoints, never exposed through public ingress.
    location ~ ^/v1/economic-(simulations|quotes)$ {
        limit_except POST { deny all; }
        limit_req zone=pricing_requests burst=4 nodelay;
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Static workbench assets do not consume the analyst API's request quota.
    # Access remains loopback-only in the local preview and disabled by default in PHP.
    location ~ ^/internal/pricing-workbench(?:\.(?:css|js))?$ {
        limit_except GET { deny all; }
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Research-only product pricing. Analyst authentication is enforced in PHP.
    location = /v1/offer-simulations {
        limit_except POST { deny all; }
        limit_req zone=pricing_requests burst=4 nodelay;
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Separate internal static assets and the old analyst-only technical screen.
    location ~ ^/internal/(?:pricing-studio\.(?:css|js)|pricing-workbench/technical)$ {
        limit_except GET { deny all; }
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Confidential research parameter read, analyst bearer required by PHP.
    location = /v1/offer-parameters {
        limit_except GET { deny all; }
        limit_req zone=pricing_requests burst=4 nodelay;
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Analyst-only configuration metadata, never a financial export.
    location = /v1/economic-metadata {
        limit_except GET { deny all; }
        limit_req zone=pricing_requests burst=4 nodelay;
        limit_conn pricing_connections 2;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 15s;
        fastcgi_pass $pricing_fpm;
    }

    # Liveness reveals no catalog, price, identity, process or configuration data.
    location = /healthz {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 5s;
        fastcgi_pass $pricing_fpm;
    }

    location @rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "2" always;
        return 429 '{"error":"rate_limited"}';
    }

    location / {
        return 404;
    }
}
